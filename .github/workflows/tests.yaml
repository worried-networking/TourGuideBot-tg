name: Run the tests

on:
  push:
    branches-ignore:
      - 'l10n_main'
      - 'dependabot/**'
    tags:
      - 'v*'
  pull_request_target:
    branches:
      - main
    types:
      - labeled
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}

jobs:
  tests:
    name: Run tests

    # Crowdin PRs only change translations, main runs the tests after the merge
    if: >-
      github.event_name != 'pull_request_target'
      || ((github.head_ref != 'l10n_main'
           || github.event.pull_request.head.repo.full_name != github.repository)
          && contains(github.event.pull_request.labels.*.name, 'S-Run-Protected-Tests'))

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.15"
        os:
          - ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Compile translations
        run: |
          uv run pybabel compile --domain=tour_guide_bot --directory=tour_guide_bot/locales

      - name: Run test suite
        env:
          TOUR_GUIDE_TELEGRAM_BOT_TOKEN: ${{ secrets.TOUR_GUIDE_TELEGRAM_BOT_TOKEN }}
          TOUR_GUIDE_TELEGRAM_APP_SESSION_STRING: ${{ secrets.TOUR_GUIDE_TELEGRAM_APP_SESSION_STRING }}
          TOUR_GUIDE_TELEGRAM_APP_API_ID: ${{ secrets.TOUR_GUIDE_TELEGRAM_APP_API_ID }}
          TOUR_GUIDE_TELEGRAM_APP_API_HASH: ${{ secrets.TOUR_GUIDE_TELEGRAM_APP_API_HASH }}
          TOUR_GUIDE_TELEGRAM_PAYMENT_TOKEN: ${{ secrets.TOUR_GUIDE_TELEGRAM_PAYMENT_TOKEN }}
        run: |
          uv run pytest --cov=tour_guide_bot --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
