pull_request_rules:
  - name: Mark for the tests on approval
    conditions:
      - "#approved-reviews-by>=1"
    actions:
      label:
        add: ["S-Run-Protected-Tests"]
  - name: Mark for the tests PRs from dependabot
    conditions:
      - "author=dependabot[bot]"
    actions:
      label:
        add: ["S-Run-Protected-Tests"]
  - name: Merge approved and tested
    conditions:
      - or:
        - "#approved-reviews-by>=1"
        - "author=dependabot[bot]"
      # Any Python version from the tests matrix, so a version bump doesn't stall the queue
      - check-success~=^Run tests \(
      - -check-failure~=^Run tests \(
    actions:
      queue:
        name: default
