[project]
name = "tour_guide_bot"
version = "0.0.1"
requires-python = ">= 3.15"
license = "Apache-2.0"
dependencies = [
    "python-telegram-bot[job-queue]>=22.8,<23",
    "babel>=2.16.0,<3",
    "sqlalchemy[asyncio,aiomysql,aiosqlite,postgresql-asyncpg]>=2.0.36,<3",
    "alembic>=1.14.0,<2",
    "psycopg2-binary>=2.9.13,<3",
    "ffmpeg-python>=0.2.0,<0.3",
    "aiohttp>=3.14.5,<4",
    "aiohttp-jinja2>=1.5.1,<2",
    "aiohttp-session>=2.12.1,<3",
    "cryptography>=50.0.2,<51",
    "jinja2>=3.1.5,<4",
]

[project.scripts]
bot = 'tour_guide_bot.cli:run'

[dependency-groups]
dev = [
    "pytest>=8.3.4,<9",
    "pytest-asyncio>=0.25.0,<0.26",
    "pytest-cov>=6.0.0,<7",
    "ruff>=0.17.1,<0.18",
    "telethon>=1.45.0,<2",
    "pytest-mock>=3.14.0,<4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
filterwarnings = [
    # Warning from past/builtins/misc, which out of our control
    "ignore:the imp module is deprecated in favour of importlib:DeprecationWarning",
    "ignore:'imghdr' is deprecated and slated for removal:DeprecationWarning",
    "ignore:pkg_resources is deprecated as an API:DeprecationWarning",
]
markers = [
    "enabled_languages",
    "approved_tour_ids",
    "tours",
    "skip_payment_token_stub",
    "payment_tokens_count",
    "skip_adding_products",
    "products_count_in_default_tour",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[tool.ruff.lint]
select = ["F"]
